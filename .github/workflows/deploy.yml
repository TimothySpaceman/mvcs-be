name: Deploy

on:
  push:
    branches: [ main, feature/releases ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /srv/apps/mvcs-be
            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            echo $PREVIOUS_COMMIT > /tmp/mvcs_previous_commit
            git pull origin feature/releases
            docker compose -f docker-compose.yml -f docker-compose.frontend.yml up -d --build

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /srv/apps/mvcs-be
            echo "Waiting for containers to start..."
            sleep 30
            CONTAINERS=("nginx" "api" "postgres" "redis" "frontend")
            FAILED=0

            for CONTAINER in "${CONTAINERS[@]}"; do
              STATUS=$(docker inspect --format='{{.State.Status}}' $CONTAINER 2>/dev/null || echo "missing")
              HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' $CONTAINER 2>/dev/null || echo "missing")

              if [ "$STATUS" != "running" ]; then
                echo "FAIL: $CONTAINER is $STATUS"
                FAILED=1
              elif [ "$HEALTH" != "none" ] && [ "$HEALTH" != "healthy" ]; then
                echo "FAIL: $CONTAINER health is $HEALTH"
                FAILED=1
              else
                echo "OK: $CONTAINER ($STATUS, health: $HEALTH)"
              fi
            done

            if [ "$FAILED" -eq 1 ]; then
              echo "Deployment verification failed. Rolling back..."

              PREVIOUS_COMMIT=$(cat /tmp/mvcs_previous_commit)
              git checkout feature/releases
              git reset --hard $PREVIOUS_COMMIT
              docker compose -f docker-compose.yml -f docker-compose.frontend.yml up -d --build

              echo "Rollback to $PREVIOUS_COMMIT complete."
              exit 1
            fi

            echo "All containers are healthy. Deployment successful."
